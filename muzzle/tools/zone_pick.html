<!DOCTYPE html>
<meta charset="utf-8">
<title>초크포인트 구역 지정 (다각형)</title>
<style>
  body { font-family: system-ui, sans-serif; margin:20px; background:#111; color:#eee; }
  h2 { margin:0 0 4px; font-size:18px; }
  p.hint { color:#9aa; margin:0 0 14px; font-size:13px; line-height:1.6; }
  b { color:#fd6; }
  canvas { display:block; border:1px solid #444; cursor:crosshair; }
  .row { margin:10px 0; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  input[type=text] { background:#222; color:#eee; border:1px solid #555;
                     padding:6px 8px; font-family:monospace; }
  button { background:#2d6; color:#000; border:0; padding:7px 14px;
           font-weight:600; cursor:pointer; border-radius:4px; }
  button.sec { background:#444; color:#ddd; }
  #out { width:100%; height:110px; background:#000; color:#3f6;
         border:1px solid #555; font-family:monospace; font-size:13px;
         padding:10px; box-sizing:border-box; }
  #info { color:#fa0; font-family:monospace; font-size:13px; min-height:20px; }
</style>

<h2>초크포인트 구역 지정 — 다각형</h2>
<p class="hint">
클릭할 때마다 꼭짓점이 하나씩 찍힌다. <b>급이 중인 소가 발을 딛고 서는 띠</b>를
따라 그린다 — 철책 너머 사료 통로가 아니라, 소의 몸이 놓이는 쪽이다.<br>
판정은 <b>bbox 아래변 중심(발 위치)</b>이 이 다각형 안에 있는지로 한다.
꼭짓점 4~8개면 충분하다. · <b>Z</b> = 마지막 점 취소 · <b>Enter</b> = 좌표 만들기
</p>

<div class="row">
  <label>이미지</label><input type="text" id="src" value="top_frame0.jpg" size="26">
  <button class="sec" onclick="load()">불러오기</button>
  <label>구역 이름</label><input type="text" id="name" value="top" size="12">
</div>

<canvas id="cv"></canvas>
<div id="info"></div>

<div class="row">
  <button onclick="emit()">좌표 만들기</button>
  <button class="sec" onclick="undo()">마지막 점 취소 (Z)</button>
  <button class="sec" onclick="reset()">전부 지우기</button>
</div>
<textarea id="out" readonly placeholder="점을 3개 이상 찍은 뒤 [좌표 만들기]"></textarea>

<script>
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
let img = new Image(), nat = [0,0], pts = [], hover = null;

function info(t){ document.getElementById('info').textContent = t; }
function load(){
  img = new Image();
  img.onload = () => {
    nat = [img.naturalWidth, img.naturalHeight];
    const sc = Math.min(1, Math.min(1150, window.innerWidth-50) / nat[0]);
    cv.width = Math.round(nat[0]*sc); cv.height = Math.round(nat[1]*sc);
    pts = []; draw();
    info(`원본 ${nat[0]}x${nat[1]} · 표시 ${cv.width}x${cv.height} · 점 0개`);
  };
  img.onerror = () => info('이미지를 못 읽었다. 파일명 확인.');
  img.src = document.getElementById('src').value + '?t=' + Date.now();
}
function draw(){
  ctx.clearRect(0,0,cv.width,cv.height);
  if (img.complete && nat[0]) ctx.drawImage(img,0,0,cv.width,cv.height);
  if (pts.length){
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (let i=1;i<pts.length;i++) ctx.lineTo(pts[i][0], pts[i][1]);
    if (hover && pts.length>=1) ctx.lineTo(hover[0], hover[1]);
    if (pts.length>=3){
      ctx.closePath();
      ctx.fillStyle='rgba(45,220,110,0.22)'; ctx.fill();
    }
    ctx.strokeStyle='#2d6'; ctx.lineWidth=2; ctx.stroke();
    pts.forEach(([x,y],i)=>{
      ctx.beginPath(); ctx.arc(x,y,5,0,7); ctx.fillStyle='#2d6'; ctx.fill();
      ctx.fillStyle='#000'; ctx.font='bold 10px monospace';
      ctx.fillText(i+1, x-3, y+3);
    });
  }
}
cv.addEventListener('click', e=>{
  const r = cv.getBoundingClientRect();
  pts.push([e.clientX-r.left, e.clientY-r.top]); draw();
  info(`점 ${pts.length}개`);
});
cv.addEventListener('mousemove', e=>{
  const r = cv.getBoundingClientRect();
  hover = [e.clientX-r.left, e.clientY-r.top];
  if (pts.length) draw();
});
cv.addEventListener('mouseleave', ()=>{ hover=null; draw(); });
window.addEventListener('keydown', e=>{
  if (e.key==='z'||e.key==='Z') undo();
  if (e.key==='Enter') emit();
});
function undo(){ pts.pop(); draw(); info(`점 ${pts.length}개`); }
function reset(){ pts=[]; draw(); document.getElementById('out').value=''; info('점 0개'); }
function emit(){
  if (pts.length < 3){ info('점을 3개 이상 찍을 것.'); return; }
  const n = pts.map(([x,y]) => [
    Math.max(0, Math.min(1, Math.round(x/cv.width *10000)/10000)),
    Math.max(0, Math.min(1, Math.round(y/cv.height*10000)/10000))]);
  const name = document.getElementById('name').value.trim() || 'zone';
  document.getElementById('out').value =
    `    "${name}": {"frame": (${nat[0]}, ${nat[1]}), "poly": [`
    + n.map(p=>`(${p[0]}, ${p[1]})`).join(', ') + `]},`;
  document.getElementById('out').select();
  info(`꼭짓점 ${n.length}개 — 아래 한 줄을 복사해서 알려줄 것`);
}
load();
</script>
